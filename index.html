<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS · AI Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 30% 10%, #0b0f1c, #03050b);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; padding: 12px; color: #e3f2fd;
      -webkit-tap-highlight-color: transparent;
    }
    .jarvis-container {
      max-width: 400px; width: 100%;
      background: rgba(10, 20, 35, 0.75);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 48px 48px 36px 36px; padding: 24px 18px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,180,255,0.2), 0 0 25px rgba(0,160,255,0.3);
      border: 1px solid rgba(0,210,255,0.25); transition: box-shadow 0.3s;
    }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 6px 12px 6px; font-size: 0.8rem; letter-spacing: 0.5px;
      color: #8ab3cf; font-weight: 500;
      border-bottom: 1px solid rgba(0,180,255,0.2); margin-bottom: 12px;
    }
    .status-bar i { color: #2dd4ff; margin-right: 4px; }
    .jarvis-logo { display: flex; align-items: center; gap: 8px; }
    .jarvis-logo i { font-size: 1.4rem; color: #2dd4ff; filter: drop-shadow(0 0 6px #00b4ff); }
    .jarvis-logo span {
      font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 2px;
      font-size: 1.2rem; background: linear-gradient(135deg, #c0e4ff, #6ec8ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 10px rgba(0,200,255,0.6);
    }
    .orb-section { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 8px 0 16px; }
    .orb-wrapper { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .orb {
      width: 130px; height: 130px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #00c8ff, #004466);
      box-shadow: 0 0 30px #0099ff, 0 0 60px #0066cc, inset 0 0 30px #aae0ff;
      transition: all 0.2s ease; animation: breathe 4s infinite alternate;
      border: 2px solid rgba(200,240,255,0.7); position: relative; z-index: 3;
    }
    .ring {
      position: absolute; border-radius: 50%;
      border: 2px solid rgba(0,210,255,0.5);
      animation: ripple 3s infinite linear; pointer-events: none;
    }
    .ring:nth-child(1) { width: 150px; height: 150px; animation-delay: 0s; }
    .ring:nth-child(2) { width: 180px; height: 180px; animation-delay: 0.8s; border-color: rgba(0,180,255,0.3); }
    .ring:nth-child(3) { width: 210px; height: 210px; animation-delay: 1.6s; border-color: rgba(0,140,255,0.2); }
    @keyframes breathe {
      0% { transform: scale(0.96); box-shadow: 0 0 30px #0099ff, 0 0 60px #0066cc; }
      100% { transform: scale(1.04); box-shadow: 0 0 45px #2db2ff, 0 0 90px #0088ff; }
    }
    @keyframes ripple {
      0% { transform: scale(0.7); opacity: 0.7; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .listening .orb {
      background: radial-gradient(circle at 30% 30%, #ffbb33, #aa3300);
      box-shadow: 0 0 50px #ffaa00, 0 0 90px #ff6600, inset 0 0 30px #ffe0a0;
      animation: breathe 1.2s infinite alternate;
    }
    .listening .ring { border-color: rgba(255,180,0,0.7); }
    .speaking .orb {
      background: radial-gradient(circle at 30% 30%, #33ffaa, #006644);
      box-shadow: 0 0 50px #00ffaa, 0 0 90px #009966, inset 0 0 30px #b3ffe0;
      animation: breathe 0.8s infinite alternate;
    }
    .speaking .ring { border-color: rgba(0,255,170,0.7); }
    .conversation-box {
      background: rgba(0,20,40,0.6); border-radius: 28px; padding: 18px 16px;
      margin: 12px 0 14px; border: 1px solid rgba(0,200,255,0.4);
      box-shadow: inset 0 0 20px rgba(0,150,255,0.2), 0 4px 12px rgba(0,0,0,0.5);
      backdrop-filter: blur(5px); min-height: 110px; max-height: 150px;
      overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2dd4ff #001a33;
    }
    .conversation-box::-webkit-scrollbar { width: 4px; }
    .conversation-box::-webkit-scrollbar-thumb { background: #2dd4ff; border-radius: 10px; }
    .message { margin-bottom: 10px; display: flex; align-items: flex-start; gap: 8px; }
    .message i { font-size: 0.9rem; color: #2dd4ff; margin-top: 3px; width: 16px; }
    .message .text { flex: 1; font-size: 0.9rem; line-height: 1.45; word-break: break-word; color: #d4edff; font-weight: 400; }
    .message.user .text { color: #aad4ff; }
    .message.jarvis .text { color: #c2f0ff; text-shadow: 0 0 4px rgba(0,200,255,0.5); }
    .controls { display: flex; justify-content: center; gap: 18px; margin-top: 6px; flex-wrap: wrap; }
    .btn {
      border: none; background: rgba(0,120,200,0.2); backdrop-filter: blur(5px);
      color: #c0e4ff; font-size: 1.6rem; width: 68px; height: 68px;
      border-radius: 40px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,180,255,0.5);
      transition: all 0.2s ease; -webkit-tap-highlight-color: transparent;
      border: 1px solid rgba(100,200,255,0.3);
    }
    .btn:active { transform: scale(0.92); background: rgba(0,160,250,0.5); box-shadow: 0 0 25px #00aaff; }
    .btn i { filter: drop-shadow(0 0 6px #00aaff); }
    .btn.mic {
      background: rgba(0,140,220,0.3); font-size: 1.9rem; width: 80px; height: 80px;
      border-radius: 50%; color: #e0f0ff; border: 2px solid #2dd4ff;
      box-shadow: 0 0 20px #0088ff, 0 8px 18px black;
    }
    .btn.mic.active {
      background: rgba(0,200,255,0.6); color: #000; border-color: #fff;
      box-shadow: 0 0 40px #00ddff;
    }
    .footer-note { text-align: center; font-size: 0.65rem; margin-top: 16px; color: #5f7e9c; letter-spacing: 1px; }
    .footer-note i { color: #2dd4ff; margin: 0 2px; }
    @media (max-width: 420px) {
      .jarvis-container { padding: 18px 12px 22px; border-radius: 36px; }
      .orb-wrapper { width: 140px; height: 140px; }
      .orb { width: 110px; height: 110px; }
      .ring:nth-child(1) { width: 130px; height: 130px; }
      .ring:nth-child(2) { width: 158px; height: 158px; }
      .ring:nth-child(3) { width: 186px; height: 186px; }
      .btn { width: 60px; height: 60px; font-size: 1.4rem; }
      .btn.mic { width: 72px; height: 72px; font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <div class="jarvis-container" id="jarvisContainer">
    <div class="status-bar">
      <div class="jarvis-logo">
        <i class="fas fa-circle-nodes"></i>
        <span>JARVIS</span>
      </div>
      <div id="liveTime"><i class="far fa-clock"></i> --:--</div>
    </div>
    <div class="orb-section">
      <div class="orb-wrapper">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="orb" id="orb"></div>
      </div>
    </div>
    <div class="conversation-box" id="conversationBox">
      <div class="message jarvis">
        <i class="fas fa-robot"></i>
        <div class="text">Systems online. How may I assist you?</div>
      </div>
      <div class="message user">
        <i class="fas fa-user"></i>
        <div class="text">Hello Jarvis, are you there?</div>
      </div>
      <div class="message jarvis">
        <i class="fas fa-robot"></i>
        <div class="text">Always. Ready for your command.</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="clearBtn" title="Clear"><i class="fas fa-trash-alt"></i></button>
      <button class="btn mic" id="micBtn" title="Tap to speak"><i class="fas fa-microphone"></i></button>
      <button class="btn" id="muteBtn" title="Mute"><i class="fas fa-volume-up"></i></button>
    </div>
    <div class="footer-note">
      <i class="fas fa-shield-halos"></i> STARK INDUSTRIES · AI CORE v4.2 <i class="fas fa-shield-halos"></i>
    </div>
  </div>

  <script>
    (function(){
      const container = document.getElementById('jarvisContainer');
      const conversationBox = document.getElementById('conversationBox');
      const micBtn = document.getElementById('micBtn');
      const clearBtn = document.getElementById('clearBtn');
      const muteBtn = document.getElementById('muteBtn');
      const liveTime = document.getElementById('liveTime');

      let isListening = false;
      let isMuted = false;
      let synth = window.speechSynthesis;
      let recognition = null;
      let listeningTimeout = null;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
          setListeningState(true);
          clearTimeout(listeningTimeout);
        };
        recognition.onerror = function(event) {
          if (event.error === 'not-allowed') {
            addMessage('jarvis', 'Microphone access denied. Please allow permissions.', 'fas fa-exclamation-triangle');
          } else if (event.error === 'no-speech') {
            addMessage('jarvis', 'I didn\'t catch that. Please try again.', 'fas fa-microphone-slash');
          } else {
            addMessage('jarvis', 'Voice input error.', 'fas fa-exclamation-circle');
          }
          setListeningState(false);
        };
        recognition.onend = function() {
          if (isListening) setListeningState(false);
        };
        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          addMessage('user', transcript, 'fas fa-user');
          setListeningState(false);
          setTimeout(() => {
            const reply = generateResponse(transcript);
            addMessage('jarvis', reply, 'fas fa-robot');
            speakText(reply);
          }, 400);
        };
      } else {
        micBtn.disabled = true;
        addMessage('jarvis', 'Voice input not supported in this browser.', 'fas fa-info-circle');
      }

      function setListeningState(listening) {
        isListening = listening;
        if (listening) {
          container.classList.add('listening');
          micBtn.classList.add('active');
          micBtn.innerHTML = '<i class="fas fa-circle"></i>';
        } else {
          container.classList.remove('listening');
          micBtn.classList.remove('active');
          micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        }
      }

      function setSpeakingState(speaking) {
        if (speaking) container.classList.add('speaking');
        else container.classList.remove('speaking');
      }

      function addMessage(sender, text, iconClass) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + sender;
        const icon = document.createElement('i');
        icon.className = iconClass || (sender === 'jarvis' ? 'fas fa-robot' : 'fas fa-user');
        const textDiv = document.createElement('div');
        textDiv.className = 'text';
        textDiv.textContent = text;
        msgDiv.appendChild(icon);
        msgDiv.appendChild(textDiv);
        conversationBox.appendChild(msgDiv);
        conversationBox.scrollTop = conversationBox.scrollHeight;
        if (conversationBox.children.length > 30) {
          conversationBox.removeChild(conversationBox.firstChild);
        }
      }

      function generateResponse(input) {
        const lower = input.toLowerCase().trim();
        if (lower.includes('hello') || lower.includes('hi') || lower.includes('hey')) return 'Hello. How can I assist you today?';
        if (lower.includes('time')) {
          const now = new Date();
          return 'Current time is ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '.';
        }
        if (lower.includes('date') || lower.includes('day')) {
          return 'Today is ' + new Date().toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'}) + '.';
        }
        if (lower.includes('weather')) return 'I cannot access live weather data yet, but it looks clear.';
        if (lower.includes('your name') || lower.includes('who are you')) return 'I am JARVIS, your AI assistant. Just a rather very intelligent system.';
        if (lower.includes('thank')) return 'You are welcome. Always at your service.';
        if (lower.includes('bye') || lower.includes('goodbye')) return 'Goodbye. I will be here if you need me.';
        if (lower.includes('jarvis')) return 'Yes, I am listening. What do you need?';
        if (lower.includes('how are you')) return 'All systems nominal. Thank you for asking.';
        const fallbacks = ['I understand. Tell me more.', 'Interesting. How can I help with that?', 'Processing... I suggest we proceed.', 'Affirmative. Anything else?'];
        return fallbacks[Math.floor(Math.random() * fallbacks.length)];
      }

      function speakText(text) {
        if (!synth || isMuted) {
          setSpeakingState(true);
          setTimeout(() => setSpeakingState(false), 500);
          return;
        }
        if (synth.speaking) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        const voices = synth.getVoices();
        const preferred = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang === 'en-US') || voices[0];
        if (preferred) utterance.voice = preferred;
        utterance.onstart = () => setSpeakingState(true);
        utterance.onend = () => setSpeakingState(false);
        utterance.onerror = () => setSpeakingState(false);
        synth.speak(utterance);
        setTimeout(() => { if (!synth.speaking) setSpeakingState(false); }, 5000);
      }

      micBtn.addEventListener('click', () => {
        if (!recognition) {
          addMessage('jarvis', 'Voice input not supported. This is a demo.', 'fas fa-robot');
          speakText('Voice input is not supported in this browser. This is a demo response.');
          return;
        }
        if (isListening) {
          try { recognition.stop(); } catch(e) {}
          setListeningState(false);
          clearTimeout(listeningTimeout);
        } else {
          try {
            recognition.start();
            listeningTimeout = setTimeout(() => {
              if (isListening) {
                recognition.stop();
                addMessage('jarvis', 'I didn\'t hear anything. Please try again.', 'fas fa-microphone-slash');
              }
            }, 8000);
          } catch (error) {
            addMessage('jarvis', 'Could not start voice recognition.', 'fas fa-exclamation-triangle');
            setListeningState(false);
          }
        }
      });

      clearBtn.addEventListener('click', () => {
        conversationBox.innerHTML = '';
        addMessage('jarvis', 'Conversation cleared. Ready for new input.', 'fas fa-robot');
        if (synth.speaking) synth.cancel();
        setSpeakingState(false);
        setListeningState(false);
        if (recognition && isListening) { try { recognition.stop(); } catch(e) {} }
      });

      muteBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        if (isMuted) {
          muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
          if (synth.speaking) synth.cancel();
          setSpeakingState(false);
          addMessage('jarvis', 'Audio output muted.', 'fas fa-volume-mute');
        } else {
          muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
          addMessage('jarvis', 'Audio output enabled.', 'fas fa-volume-up');
          speakText('Audio output enabled.');
        }
      });

      function updateTime() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        liveTime.innerHTML = '<i class="far fa-clock"></i> ' + timeStr;
      }
      updateTime();
      setInterval(updateTime, 1000);

      if (synth) synth.getVoices();

      setTimeout(() => { if (!isMuted) speakText('Systems online. How may I assist you?'); }, 800);
    })();
  </script>
</body>
</html>
